<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager — Stanza</title>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </head>
  <body>
    <script>
      // ── Preview styles ────────────────────────────────────────────────────
      CMS.registerPreviewStyle(
        `@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&subset=greek&display=swap');
        :root { --bg-color: #e4e2d7; --text-color: #2c2c2c; --accent-color: #8c3b3b; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'EB Garamond', serif; font-size: 24px; line-height: 1.7;
               background: var(--bg-color); color: var(--text-color); padding: 2rem; }
        h1, h2, h3 { line-height: 1.2; margin-bottom: 1rem; }
        h1 { font-size: 1.8rem; }
        .poem-title { margin-bottom: 2rem; }
        p { margin-bottom: 1.2rem; white-space: pre-wrap; }
        hr { border: none; border-top: 1px solid currentColor; opacity: 0.3; margin: 2rem 0; }
        blockquote { border-left: 3px solid var(--accent-color); padding-left: 1rem; opacity: 0.8; }
        code { font-size: 0.85em; background: rgba(0,0,0,0.05); padding: 0.1em 0.3em; }
        pre { background: rgba(0,0,0,0.05); padding: 1rem; overflow-x: auto; }`,
        { raw: true },
      );

      // ── Poem preview template ─────────────────────────────────────────────
      var h = CMS.h;

      var PoemPreview = createClass({
        render: function () {
          var entry = this.props.entry;
          var title = entry.getIn(['data', 'title']);
          var lang = entry.getIn(['data', 'lang']);
          var body = this.props.widgetFor('body');

          return h(
            'article',
            null,
            h(
              'h1',
              { className: 'poem-title', style: { marginBottom: '2rem' } },
              title,
            ),
            body,
            h(
              'p',
              {
                style: {
                  fontSize: '0.7rem',
                  opacity: 0.5,
                  marginTop: '3rem',
                  borderTop: '1px solid currentColor',
                  paddingTop: '1rem',
                },
              },
              'Language: ' + lang,
            ),
          );
        },
      });

      CMS.registerPreviewTemplate('poems', PoemPreview);
    </script>
  </body>
</html>
