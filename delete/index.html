<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stanza | The Elegant Multi-Collection Poetry Platform</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #e4e2d7;
            --text-color: #2c2c2c;
            --accent-color: #8c3b3b;
            --border-color: rgba(140, 59, 59, 0.3);
            --font-main: 'EB Garamond', serif;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --border-color: rgba(224, 224, 224, 0.2);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            margin: 0;
            line-height: 1.7;
            font-size: 20px;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        header {
            max-width: 1000px;
            margin: 0 auto 6rem;
            text-align: center;
            position: relative;
        }

        .controls {
            position: absolute;
            top: -2rem;
            right: 0;
            display: flex;
            gap: 15px;
        }

        .control-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            font-family: inherit;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        h1 {
            font-weight: 400;
            font-style: italic;
            font-size: 5rem;
            margin: 0;
            letter-spacing: -0.02em;
            color: var(--accent-color);
        }

        .subtitle {
            font-size: 1.6rem;
            opacity: 0.8;
            margin-top: 1rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero-visual {
            margin: 4rem 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .hero-visual img {
            width: 100%;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.5s ease;
        }

        .hero-visual img:hover {
            transform: translateY(-5px);
        }

        section {
            margin-bottom: 5rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease-out;
        }

        section.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        h2 {
            font-weight: 400;
            font-size: 2.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
            margin-bottom: 2rem;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 60px 40px;
        }

        .feature-item h3 {
            color: var(--accent-color);
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.4rem;
        }

        .cta-container {
            text-align: center;
            margin-top: 8rem;
            padding: 4rem;
            border: 1px solid var(--border-color);
            background: rgba(140, 59, 59, 0.03);
            border-radius: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 0.8rem 2.5rem;
            background-color: var(--accent-color);
            color: white !important;
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            gap: 12px;
            border-radius: 50px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(140, 59, 59, 0.3);
        }

        .btn svg {
            width: 20px;
            height: 20px;
        }

        .btn-margin {
            margin-top: 2rem;
        }

        footer {
            text-align: center;
            margin-top: 6rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
            font-size: 0.9rem;
            opacity: 0.6;
        }

        code {
            background: rgba(140, 59, 59, 0.1);
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-family: monospace;
            font-size: 0.9em;
            color: var(--accent-color);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 3rem;
            }

            .container {
                padding: 2rem 1rem;
            }

            .controls {
                position: relative;
                top: 0;
                justify-content: center;
                margin-bottom: 2.5rem;
            }

            .features-grid {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .hero-visual {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="controls">
                <button class="control-btn" id="lang-toggle">Ελληνικά</button>
                <button class="control-btn" id="theme-toggle">Dark Mode</button>
            </div>
            <h1 class="reveal">Stanza</h1>
            <p class="subtitle reveal" id="hero-subtitle">The elegant, multi-collection portal for modern poets.
            </p>
            <div class="reveal">
                <a href="https://costas.design/stanza" target="_blank" class="btn btn-margin" id="action-btn">
                    <span id="action-btn-text">See it in action</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </a>
            </div>
        </header>

        <section id="preview" class="reveal">
            <div class="hero-visual">
                <img src="https://github.com/cozats/Stanza/blob/main/screens/home-en-dark.png?raw=true"
                    alt="Dark Mode Home Preview">
                <img src="https://github.com/cozats/Stanza/blob/main/screens/poem-en-dark.png?raw=true"
                    alt="Dark Mode Poem Preview">
            </div>
        </section>

        <section id="features" class="reveal">
            <h2 id="features-title">The Platform</h2>
            <div class="features-grid" id="features-grid">
                <!-- Features injected by JS -->
            </div>
        </section>

        <section id="instructions" class="reveal">
            <h2 id="instructions-title">How it Works</h2>
            <ol id="instructions-list">
                <!-- Instructions injected by JS -->
            </ol>
        </section>

        <div class="cta-container reveal">
            <h2 id="cta-title">Ready to launch your platform?</h2>
            <p id="cta-subtitle">Stanza is open-source and free to use forever.</p>
            <br>
            <a href="https://github.com/cozats/Stanza" class="btn">
                <span id="cta-btn-text">Star on GitHub</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path
                        d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22">
                    </path>
                </svg>
            </a>
        </div>

        <footer>
            <p id="footer-text">&copy; 2026 Stanza. Designed for poets, by poets.</p>
        </footer>
    </div>

    <script>
        const translations = {
            en: {
                langBtn: "Ελληνικά",
                themeBtnDark: "Dark Mode",
                themeBtnLight: "Light Mode",
                subtitle: "The elegant, multi-collection portal for modern poets. Host your entire body of work in a single, database-free platform.",
                featuresTitle: "The Experience",
                features: [
                    { h: "Multi-Collection Hub", p: "Host multiple distinct collections of poetry. Perfect for organizing works by era, theme, or book." },
                    { h: "Master Landing Page", p: "A unified portal with your author profile that dynamically lists all your available collections." },
                    { h: "Polished UI/UX", p: "Custom modals, persistent theme toggles, and refined toast notifications for a premium feel." },
                    { h: "Shared Session Management", p: "Log in once on your landing page and manage all your collections effortlessly from one place." },
                    { h: "Database-Free (Flat File)", p: "Powered by PHP and Markdown. Lightweight, fast, and easy to move between hosting providers." },
                    { h: "Bilingual Intelligence", p: "Full Greek and English support. Automatically serves translations of poems when available." }
                ],
                instructionsTitle: "How it Works",
                instructions: [
                    "Package: Download <a href='https://github.com/cozats/Stanza/archive/refs/heads/main.zip' style='color: var(--accent-color); font-weight: 600;'>Stanza</a> and upload it to any PHP-enabled host.",
                    "Identify: Log in via the 'Management' link in the footer using the default password (it is \"<span style='color: var(--accent-color); font-weight: 600;'>password</span>\").",
                    "Cultivate: Create new collections directly from your dashboard and upload your poems as .md files."
                ],
                ctaTitle: "Ready to launch your platform?",
                ctaSubtitle: "Stanza is open-source and free to use forever for every poet.",
                ctaBtn: "Star on GitHub",
                actionBtn: "See it in action",
                footer: "&copy; 2026 Stanza. Designed for poets, by poets."
            },
            el: {
                langBtn: "English",
                themeBtnDark: "Σκοτεινό Θέμα",
                themeBtnLight: "Φωτεινό Θέμα",
                subtitle: "Η κομψή πύλη πολλαπλών συλλογών για σύγχρονους ποιητές. Φιλοξενήστε ολόκληρο το έργο σας σε μια πλατφόρμα χωρίς βάσεις δεδομένων.",
                featuresTitle: "Η Εμπειρία",
                features: [
                    { h: "Κέντρο Πολλαπλών Συλλογών", p: "Φιλοξενήστε διαφορετικές συλλογές ποίησης. Ιδανικό για οργάνωση έργων ανά εποχή, θέμα ή βιβλίο." },
                    { h: "Κεντρική Πύλη Εισόδου", p: "Μια ενιαία σελίδα με το προφίλ σας που εμφανίζει δυναμικά όλες τις διαθέσιμες συλλογές σας." },
                    { h: "Εκλεπτυσμένο UI/UX", p: "Προσαρμοσμένα modals, σταθεροί διακόπτες θέματος και εκλεπτυσμένες ειδοποιήσεις για premium αίσθηση." },
                    { h: "Ενιαία Διαχείριση", p: "Συνδεθείτε μία φορά στην αρχική σας σελίδα και διαχειριστείτε όλες τις συλλογές σας από ένα σημείο." },
                    { h: "Χωρίς Βάσεις Δεδομένων", p: "Βασισμένο σε PHP και Markdown. Ελαφρύ, γρήγορο και εύκολο στη μεταφορά σε οποιονδήποτε πάροχο." },
                    { h: "Δίγλωσση Νοημοσύνη", p: "Πλήρης υποστήριξη Ελληνικών και Αγγλικών. Αυτόματη προβολή μεταφράσεων όταν είναι διαθέσιμες." }
                ],
                instructionsTitle: "Πώς Λειτουργεί",
                instructions: [
                    "Εγκατάσταση: Κατεβάστε το <a href='https://github.com/cozats/Stanza/archive/refs/heads/main.zip' style='color: var(--accent-color); font-weight: 600;'>Stanza</a> και ανεβάστε το σε οποιονδήποτε PHP host.",
                    "Ταυτοποίηση: Συνδεθείτε μέσω του συνδέσμου 'Διαχείριση' χρησιμοποιώντας τον προεπιλεγμένο κωδικό (είναι <span style='color: var(--accent-color); font-weight: 600;'>password</span>).",
                    "Δημιουργία: Φτιάξτε νέες συλλογές από το dashboard σας και ανεβάστε τα ποιήματά σας ως αρχεία .md."
                ],
                ctaTitle: "Έτοιμοι να ξεκινήσετε την πλατφόρμα σας;",
                ctaSubtitle: "Το Stanza είναι ανοιχτού κώδικα και δωρεάν για πάντα για κάθε ποιητή.",
                ctaBtn: "Star στο GitHub",
                actionBtn: "Δείτε το στην πράξη",
                footer: "&copy; 2026 Stanza. Σχεδιασμένο για ποιητές, από ποιητές."
            }
        };

        let currentLang = 'en';

        function updateContent() {
            const t = translations[currentLang];
            document.getElementById('lang-toggle').textContent = t.langBtn;
            document.getElementById('theme-toggle').textContent = document.body.getAttribute('data-theme') === 'dark' ? t.themeBtnLight : t.themeBtnDark;
            document.getElementById('hero-subtitle').textContent = t.subtitle;
            document.getElementById('features-title').textContent = t.featuresTitle;
            document.getElementById('instructions-title').textContent = t.instructionsTitle;
            document.getElementById('cta-title').textContent = t.ctaTitle;
            document.getElementById('cta-subtitle').textContent = t.ctaSubtitle;
            document.getElementById('cta-btn-text').textContent = t.ctaBtn;
            document.getElementById('action-btn-text').textContent = t.actionBtn;
            document.getElementById('footer-text').innerHTML = t.footer;

            // Features
            const grid = document.getElementById('features-grid');
            grid.innerHTML = t.features.map(f => `
                <div class="feature-item">
                    <h3>${f.h}</h3>
                    <p>${f.p}</p>
                </div>
            `).join('');

            // Instructions
            const list = document.getElementById('instructions-list');
            list.innerHTML = t.instructions.map(i => `<li>${i}</li>`).join('');
        }

        // Initialize content
        updateContent();

        // Language Toggle
        document.getElementById('lang-toggle').addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'el' : 'en';
            updateContent();
        });

        // Theme Toggle Logic
        const themeToggle = document.getElementById('theme-toggle');
        themeToggle.addEventListener('click', () => {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            themeToggle.textContent = isDark ? translations[currentLang].themeBtnDark : translations[currentLang].themeBtnLight;
        });

        // Reveal on Scroll
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('section, header, .cta-container').forEach(el => observer.observe(el));
    </script>
</body>

</html>
