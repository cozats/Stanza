<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stanza | Elegant & Minimalist Poetry Platform</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #e4e2d7;
            --text-color: #2c2c2c;
            --accent-color: #8c3b3b;
            --border-color: rgba(140, 59, 59, 0.3);
            --font-main: 'EB Garamond', serif;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --border-color: rgba(224, 224, 224, 0.2);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            margin: 0;
            line-height: 1.7;
            font-size: 20px;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 6rem;
            position: relative;
        }

        .controls {
            position: absolute;
            top: -2rem;
            right: 0;
            display: flex;
            gap: 15px;
        }

        .control-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            font-family: inherit;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        h1 {
            font-weight: 400;
            font-style: italic;
            font-size: 4rem;
            margin: 0;
            letter-spacing: -0.02em;
            color: var(--accent-color);
        }

        .subtitle {
            font-size: 1.5rem;
            opacity: 0.8;
            margin-top: 1rem;
        }

        .hero-visual {
            margin: 4rem 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .hero-visual img {
            width: 100%;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.5s ease;
        }

        .hero-visual img:hover {
            transform: translateY(-5px);
        }

        section {
            margin-bottom: 5rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease-out;
        }

        section.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        h2 {
            font-weight: 400;
            font-size: 2.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
            margin-bottom: 2rem;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px;
        }

        .feature-item h3 {
            color: var(--accent-color);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .cta-container {
            text-align: center;
            margin-top: 8rem;
            padding: 4rem;
            border: 1px solid var(--border-color);
            background: rgba(140, 59, 59, 0.03);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 1rem 2.5rem;
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            font-size: 1.4rem;
            transition: all 0.3s ease;
            gap: 12px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(140, 59, 59, 0.3);
        }

        .btn svg {
            width: 20px;
            height: 20px;
        }

        .btn-action {
            margin-top: 2rem;
            border-radius: 50px;
            font-size: 1.1rem;
            padding: 0.8rem 2rem;
        }

        footer {
            text-align: center;
            margin-top: 6rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
            font-size: 0.9rem;
            opacity: 0.6;
        }

        code {
            background: rgba(0, 0, 0, 0.05);
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-family: monospace;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .container {
                padding: 2rem 1rem;
            }

            .controls {
                position: relative;
                top: 0;
                justify-content: center;
                margin-bottom: 2rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="controls">
                <button class="control-btn" id="lang-toggle">Ελληνικά</button>
                <button class="control-btn" id="theme-toggle">Dark Mode</button>
            </div>
            <h1 class="reveal">Stanza</h1>
            <p class="subtitle reveal" id="hero-subtitle">A simple, elegant, and lightning-fast home for your poetry.
            </p>
            <div class="reveal">
                <a href="https://costas.design/stanza" target="_blank" class="btn btn-action" id="action-btn">
                    <span id="action-btn-text">See it in action</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </a>
            </div>
        </header>

        <section id="preview" class="reveal">
            <div class="hero-visual">
                <img src="https://github.com/cozats/Stanza/blob/main/screens/home-en-light.png?raw=true"
                    alt="Light Mode Preview">
                <img src="https://github.com/cozats/Stanza/blob/main/screens/home-en-dark.png?raw=true"
                    alt="Dark Mode Preview">
            </div>
        </section>

        <section id="features" class="reveal">
            <h2 id="features-title">Core Experience</h2>
            <div class="features-grid" id="features-grid">
                <!-- Features injected by JS -->
            </div>
        </section>

        <section id="instructions" class="reveal">
            <h2 id="instructions-title">Quick Start</h2>
            <ol id="instructions-list">
                <!-- Instructions injected by JS -->
            </ol>
        </section>

        <div class="cta-container reveal">
            <h2 id="cta-title">Ready to share your work?</h2>
            <p id="cta-subtitle">Download the template and launch your own collection in minutes.</p>
            <br>
            <a href="https://github.com/cozats/Stanza" class="btn">
                <span id="cta-btn-text">View on GitHub</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path
                        d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22">
                    </path>
                </svg>
            </a>
        </div>

        <footer>
            <p id="footer-text">&copy; 2026 Stanza. Created for poets, by poets.</p>
        </footer>
    </div>

    <script>
        const translations = {
            en: {
                langBtn: "Ελληνικά",
                themeBtnDark: "Dark Mode",
                themeBtnLight: "Light Mode",
                subtitle: "A simple, elegant, and lightning-fast home for your words.",
                featuresTitle: "Core Experience",
                features: [
                    { h: "Minimalist Design", p: "Zero distractions. Beautiful EB Garamond typography that puts your poetry center stage." },
                    { h: "Dual Soul", p: "Automatic Light and Dark themes to provide the perfect atmosphere for reading at any hour." },
                    { h: "Zero Database", p: "Powered by flat-file Markdown. No SQL setup, no complexity. Just upload and publish." },
                    { h: "Bilingual", p: "Native support for English and Greek, both in the interface and the content logic." }
                ],
                instructionsTitle: "Quick Start",
                instructions: [
                    "<strong>Deploy:</strong> Upload the <code>index.php</code> and <code>poems/</code> folder to any PHP host.",
                    "<strong>Configure:</strong> Edit the top section of <code>index.php</code> with your name and password.",
                    "<strong>Write:</strong> Create <code>.md</code> files using simple Markdown syntax."
                ],
                ctaTitle: "Ready to share your work?",
                ctaSubtitle: "Download the template and launch your own collection in minutes.",
                ctaBtn: "View on GitHub",
                actionBtn: "See it in action",
                footer: "&copy; 2026 Stanza. Created for poets, by poets."
            },
            el: {
                langBtn: "English",
                themeBtnDark: "Σκοτεινό Θέμα",
                themeBtnLight: "Φωτεινό Θέμα",
                subtitle: "Ένα απλό, κομψό και ταχύτατο σπίτι για την ποίησή σας.",
                featuresTitle: "Βασική Εμπειρία",
                features: [
                    { h: "Μινιμαλιστική Σχεδίαση", p: "Μηδενικοί περισπασμοί. Όμορφη τυπογραφία EB Garamond που βάζει την ποίησή σας στο επίκεντρο." },
                    { h: "Διπλή Υπόσταση", p: "Αυτόματα φωτεινά και σκοτεινά θέματα για την τέλεια ατμόσφαιρα ανάγνωσης κάθε ώρα." },
                    { h: "Χωρίς Βάση Δεδομένων", p: "Βασισμένο σε αρχεία Markdown. Χωρίς ρυθμίσεις SQL, χωρίς πολυπλοκότητα. Απλά ανεβάστε και δημοσιεύστε." },
                    { h: "Δίγλωσσο", p: "Εγγενής υποστήριξη για Αγγλικά και Ελληνικά, τόσο στο περιβάλλον όσο και στη λογική περιεχομένου." }
                ],
                instructionsTitle: "Γρήγορη Εκκίνηση",
                instructions: [
                    "<strong>Εγκατάσταση:</strong> Ανεβάστε το <code>index.php</code> και τον φάκελο <code>poems/</code> σε οποιονδήποτε PHP host.",
                    "<strong>Ρύθμιση:</strong> Επεξεργαστείτε το πάνω μέρος του <code>index.php</code> με το όνομα και τον κωδικό σας.",
                    "<strong>Συγγραφή:</strong> Δημιουργήστε αρχεία <code>.md</code> χρησιμοποιώντας απλή σύνταξη Markdown."
                ],
                ctaTitle: "Έτοιμοι να μοιραστείτε το έργο σας;",
                ctaSubtitle: "Κατεβάστε το template και ξεκινήστε τη δική σας συλλογή σε λίγα λεπτά.",
                ctaBtn: "Δείτε το στο GitHub",
                actionBtn: "Δείτε το στην πράξη",
                footer: "&copy; 2026 Stanza. Δημιουργήθηκε για ποιητές, από ποιητές."
            }
        };

        let currentLang = 'en';

        function updateContent() {
            const t = translations[currentLang];
            document.getElementById('lang-toggle').textContent = t.langBtn;
            document.getElementById('theme-toggle').textContent = document.body.getAttribute('data-theme') === 'dark' ? t.themeBtnLight : t.themeBtnDark;
            document.getElementById('hero-subtitle').textContent = t.subtitle;
            document.getElementById('features-title').textContent = t.featuresTitle;
            document.getElementById('instructions-title').textContent = t.instructionsTitle;
            document.getElementById('cta-title').textContent = t.ctaTitle;
            document.getElementById('cta-subtitle').textContent = t.ctaSubtitle;
            document.getElementById('cta-btn-text').textContent = t.ctaBtn;
            document.getElementById('action-btn-text').textContent = t.actionBtn;
            document.getElementById('footer-text').innerHTML = t.footer;

            // Features
            const grid = document.getElementById('features-grid');
            grid.innerHTML = t.features.map(f => `
                <div class="feature-item">
                    <h3>${f.h}</h3>
                    <p>${f.p}</p>
                </div>
            `).join('');

            // Instructions
            const list = document.getElementById('instructions-list');
            list.innerHTML = t.instructions.map(i => `<li>${i}</li>`).join('');
        }

        // Initialize content
        updateContent();

        // Language Toggle
        document.getElementById('lang-toggle').addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'el' : 'en';
            updateContent();
        });

        // Theme Toggle Logic
        const themeToggle = document.getElementById('theme-toggle');
        themeToggle.addEventListener('click', () => {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            themeToggle.textContent = isDark ? translations[currentLang].themeBtnDark : translations[currentLang].themeBtnLight;
        });

        // Reveal on Scroll
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    </script>
</body>

</html>
